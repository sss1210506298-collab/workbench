<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="icon" href="icons/icon-512.png">
<title>我的工作台</title>
<style>
/* ---------- 主题：每个模块一套浅色底 ---------- */
:root{
  --card:#fff; --ink:#20242e; --sub:#6b7280; --muted:#98a1ad; --line:#e8eaef;
  --radius:18px; --shadow:0 1px 2px rgba(22,28,44,.04), 0 8px 22px rgba(22,28,44,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:15px/1.62 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  transition:background .25s ease;
}
body[data-mod="money"]{--bg:#edf3f9;--tint:#e0eaf5;--accent:#3f6f9f;--accent-soft:#e0eaf5}
body[data-mod="work"] {--bg:#f7f1e9;--tint:#efe4d5;--accent:#8b6b4a;--accent-soft:#f0e5d7}
body[data-mod="photo"]{--bg:#f3f1f9;--tint:#e7e2f3;--accent:#6f5d9c;--accent-soft:#e9e4f5}
body[data-mod="fit"]  {--bg:#eef4ee;--tint:#e1ece3;--accent:#4d7a58;--accent-soft:#e2ede4}
body[data-mod="exam"] {--bg:#fbf5e3;--tint:#f6ecce;--accent:#9c7a2b;--accent-soft:#f4e8c6}

.app{max-width:480px;margin:0 auto;padding:0 14px 96px}

/* ---------- 头部 ---------- */
header{padding:20px 2px 6px}
.h-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.h-title{font-size:20px;font-weight:700;letter-spacing:.2px}
.h-sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--sub);
  border-radius:12px;width:38px;height:38px;font-size:16px;display:grid;place-items:center;cursor:pointer}

.summary{display:flex;gap:8px;margin:14px 0 2px;overflow:auto;padding-bottom:2px;scrollbar-width:none}
.summary::-webkit-scrollbar{display:none}
.summary .s{flex:1 0 auto;min-width:92px;background:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:9px 12px}
.summary .s b{display:block;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.summary .s span{font-size:11px;color:var(--muted)}

/* ---------- 子页面切换 ---------- */
.subnav{display:flex;gap:4px;background:var(--accent-soft);padding:4px;border-radius:14px;margin:14px 0}
.subnav button{flex:1;border:0;background:transparent;padding:8px 0;border-radius:11px;
  font-size:13.5px;color:var(--sub);cursor:pointer;font-family:inherit}
.subnav button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 3px rgba(22,28,44,.08)}

/* ---------- 通用卡片 ---------- */
.tab{display:none}
.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;display:flex;align-items:center;
  justify-content:space-between;gap:8px;letter-spacing:.2px}
.card h3 .sub{font-weight:400;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.stat .lb{font-size:12px;color:var(--sub)}
.stat .val{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
.stat .val small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.stat .note{font-size:11px;color:var(--muted);margin-top:3px}

.bar{height:8px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.bar-row{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:7px}

.kv{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:6px 0;
  border-bottom:1px dashed var(--line)}
.kv:last-of-type{border-bottom:0}
.kv span{color:var(--sub)}
.kv b{font-variant-numeric:tabular-nums}

ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
.chk{width:22px;height:22px;border-radius:8px;border:1.6px solid #d7dbe3;flex:0 0 auto;cursor:pointer;
  display:grid;place-items:center;font-size:12px;color:#fff;background:#fff}
.chk.on{background:var(--accent);border-color:var(--accent)}
.li-main{flex:1;min-width:0}
.li-main .t{font-size:14px;display:block}
.li-main .t.done{color:var(--muted);text-decoration:line-through}
.li-main .m{font-size:11.5px;color:var(--muted);margin-top:2px;display:block}
.x{border:0;background:transparent;color:#c6ccd6;font-size:17px;cursor:pointer;padding:0 3px;line-height:1}
.amount{font-variant-numeric:tabular-nums;font-weight:600}
.amount.out{color:#c25b5b}

input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;border:1px solid var(--line);background:#fafbfc;border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff}
textarea{resize:vertical;min-height:68px}
.row{display:flex;gap:8px}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:11px 15px;
  font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--accent-soft);color:var(--accent);font-weight:500}
.btn.mini{padding:7px 11px;font-size:13px;border-radius:10px}
.hint{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:9px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:16px 0}
.big{font-size:25px;font-weight:700;color:var(--accent);letter-spacing:.2px}
.pill{display:inline-block;background:var(--accent-soft);border-radius:99px;padding:2px 10px;
  font-size:11px;color:var(--accent);margin-right:6px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;
  font-size:13.5px;cursor:pointer;color:#4a5164}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chip.add{border-style:dashed;color:var(--muted)}
.chip .rm{margin-left:6px;color:#c25b5b;font-weight:700}
.amt-in{width:100%;text-align:center;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:14px;border-radius:16px;border:1px solid var(--line);background:#fafbfc}

.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:140px;height:140px;flex:0 0 auto}
.legend{flex:1;min-width:190px}
.legend li{display:flex;align-items:center;gap:8px;font-size:13px;padding:3.5px 0;list-style:none}
.legend .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.legend .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#41485a}
.legend .vv{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}

.segs{display:flex;gap:4px;background:var(--accent-soft);padding:3px;border-radius:11px}
.segs button{border:0;background:transparent;padding:4px 11px;border-radius:9px;font-size:12px;
  color:var(--sub);cursor:pointer}
.segs button.on{background:#fff;color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}

.timer-box{display:flex;align-items:center;gap:12px;margin:6px 0 12px}
.timer-box .tm{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:1px;color:var(--accent)}
.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day-cell{background:#f7f8fa;border-radius:11px;padding:8px 0;text-align:center;font-size:11px;color:var(--muted)}
.day-cell b{display:block;font-size:12px;color:#41485a;font-weight:600;margin-bottom:1px}
.day-cell.done{background:var(--accent-soft);color:var(--accent)}
.day-cell.done b{color:var(--accent)}
.day-cell.today{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.plan-day{border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:10px}
.plan-day.today{border-color:var(--accent);background:var(--accent-soft)}
.plan-day .hd{display:flex;gap:8px;align-items:center}
.plan-day .hd b{font-size:13px;color:var(--accent);flex:0 0 42px}
.plan-day input{background:#fafbfc}
.plan-day .exline{display:flex;gap:6px;margin-top:7px;align-items:center}
.plan-day .exline input{flex:1;padding:8px 10px;font-size:13.5px}

nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabbar button{flex:1;border:0;background:transparent;padding:6px 0;color:var(--muted);
  font-size:11px;cursor:pointer;font-family:inherit}
nav.tabbar button i{display:block;font-size:19px;font-style:normal;line-height:1.35;
  filter:grayscale(1);opacity:.5}
nav.tabbar button.on{color:var(--accent);font-weight:600}
nav.tabbar button.on i{filter:none;opacity:1}

.mask{position:fixed;inset:0;background:rgba(24,28,38,.34);display:none;place-items:center;
  padding:20px;z-index:9}
.mask.on{display:grid}
.sheet{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:400px;
  max-height:82vh;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:16.5px}
.sheet .hint{margin:6px 0 14px}
.sheet .btns{display:flex;gap:8px;margin-top:12px}
</style>
</head>
<body data-mod="exam">
<div class="app">
  <header>
    <div class="h-top">
      <div>
        <div class="h-title" id="hTitle">我的工作台</div>
        <div class="h-sub" id="hDate"></div>
      </div>
      <button class="icon-btn" id="btnSet" title="设置与备份">⚙</button>
    </div>
    <div class="summary" id="summary"></div>
  </header>

  <div class="subnav" id="subnav"></div>

  <main>
    <section class="tab on" id="tab-money"></section>
    <section class="tab" id="tab-work"></section>
    <section class="tab" id="tab-photo"></section>
    <section class="tab" id="tab-fit"></section>
    <section class="tab" id="tab-exam"></section>
  </main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-tab="exam" class="on"><i>📖</i>备考</button>
  <button data-tab="money"><i>💰</i>存钱</button>
  <button data-tab="fit"><i>💪</i>健身</button>
  <button data-tab="work"><i>📋</i>工作</button>
  <button data-tab="photo"><i>📷</i>摄影</button>
</nav>

<div class="mask" id="mask">
  <div class="sheet">
    <h2>设置与备份</h2>
    <p class="hint">数据存在这台手机的浏览器里（localStorage），不会上传。换手机或清缓存前先导出备份。</p>
    <div class="btns">
      <button class="btn ghost" id="btnExport">导出备份</button>
      <button class="btn ghost" id="btnImport">导入备份</button>
    </div>
    <div class="btns">
      <button class="btn ghost" id="btnDemo">填入示例数据</button>
      <button class="btn ghost" id="btnReset" style="color:#c25b5b">清空全部</button>
    </div>
    <div class="btns"><button class="btn" id="btnClose" style="flex:1">关闭</button></div>
    <input type="file" id="fileIn" accept="application/json" style="display:none">
  </div>
</div>

<script>
/* ==================================================================
   1. 数据
================================================================== */
const VERSION = 2;
const TAGS = [
  ["吃饭","#e08a4a","必要"],["交通","#5b86b8","必要"],["生活","#4f9c94","必要"],
  ["医疗","#c2605f","必要"],["缴费","#7a8aa8","必要"],
  ["购物","#c4799b","零花"],["娱乐","#8478b8","零花"],["学习","#bfa04e","零花"],["其他","#8d95a3","零花"],
  ["保险","#5b93a8","专项"],["汽车","#6f9a72","专项"],["数码","#9b7fb8","专项"],
  ["运动","#7fa35c","专项"],["人情","#c07b6a","专项"]
];
const PALETTE = ["#e08a4a","#5b86b8","#4f9c94","#c4799b","#8478b8","#c2605f",
                 "#bfa04e","#8d95a3","#5b93a8","#6f9a72","#9b7fb8","#c07b6a"];
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
const WEEK_S = ["日","一","二","三","四","五","六"];

const FIT_WEEK_DEFAULT = {
  1:{name:"推日（胸/肩/三头）", ex:[
    "杠铃卧推 4组×6-8次","哑铃上斜卧推 3组×8-10次","双杠臂屈伸（辅助或退阶） 3组×8-10次",
    "Y字侧平举 3组×12-15次","三头绳索下压 3组×10-12次"]},
  2:{name:"休息", ex:[]},
  3:{name:"拉日（背/肩后束/二头）", ex:[
    "辅助引体向上 4组×8-10次（主项）","高位下拉 3组×10-12次","坐姿器械划船 3组×10-12次",
    "面拉 3组×12-15次","钢线弯举 3组×10-12次"]},
  4:{name:"休息", ex:[]},
  5:{name:"腿日（股四/腘绳/臀）", ex:[
    "高脚杯深蹲 4组×8-10次（先学动作模式）","保加利亚分腿蹲 3组×8-10次/腿",
    "罗马尼亚硬拉 3组×8-10次","腿弯举 3组×12-15次","站姿提踵 4组×12-15次"]},
  6:{name:"有氧", ex:["爬坡走 45 分钟"]},
  0:{name:"有氧", ex:["爬坡走 45 分钟"]}
};

function defaults(){
  return {
    version: VERSION,
    money:{
      accounts:{free:0, locked:0},
      dailyBudget:80,
      expenses:[],
      tags:TAGS.map(([name,color,bucket])=>({name,color,bucket})),
      plan:{income:8650, essential:1100, pocket:1000, buffer:600, yearGoal:100000, savedBase:0},
      saved:{},
      holdings:[],
      period:"month"
    },
    work:{tasks:[]},
    photo:{
      minutes:30, time:"20:00",
      plan:[{id:"p1", text:"摄影学习 30 分钟"}],
      log:{}, note:{}
    },
    fit:{
      profile:{weight:72, height:177, age:24, bodyFat:25, activity:1.5, goal:"recomp"},
      week:JSON.parse(JSON.stringify(FIT_WEEK_DEFAULT)),
      log:{}, ex:{}
    },
    exam:{
      exams:[
        {id:"x1", name:"浙江省事业单位统考（瑞安）", date:"2027-05-15"},
        {id:"x2", name:"国考（2028年度）", date:"2027-11-28"},
        {id:"x3", name:"浙江省考", date:"2027-12-20"}
      ],
      template:["资料分析 25 分钟","判断推理 25 分钟","言语 10 题"],
      tasks:{},
      phases:[
        {id:"p1", name:"打地基", from:"2026-10-18", to:"2027-03-31",
         goal:"资料分析正确率 85%，判断推理 75%"},
        {id:"p2", name:"事业单位冲刺", from:"2027-04-01", to:"2027-05-20",
         goal:"职测套题 + 综应 A 类专项（案例分析、公文写作）"},
        {id:"p3", name:"国考强化", from:"2027-06-01", to:"2027-10-31",
         goal:"行测全模块 + 申论系统学"},
        {id:"p4", name:"国考省考冲刺", from:"2027-11-01", to:"2027-12-31",
         goal:"每周 2 套模考 + 申论大作文每周 1 篇"}
      ],
      notes:{}
    }
  };
}

const KEY="my.workbench.v1";
let D = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return defaults();
    const d = JSON.parse(raw), base = defaults();
    const out = {
      ...base, ...d,
      money:{...base.money, ...(d.money||{})},
      work:{...base.work, ...(d.work||{})},
      photo:{...base.photo, ...(d.photo||{})},
      fit:{...base.fit, ...(d.fit||{}), profile:{...base.fit.profile, ...((d.fit||{}).profile||{})}},
      exam:{...base.exam, ...(d.exam||{})}
    };
    if(!out.money.tags || !out.money.tags.length) out.money.tags = base.money.tags;
    out.money.tags = out.money.tags.map(t=>{
      if(t.bucket) return t;
      const hit = TAGS.find(x=>x[0]===t.name);
      return {...t, bucket: hit ? hit[2] : "零花"};
    });
    out.money.plan = {...base.money.plan, ...((d.money||{}).plan||{})};
    out.money.saved = (d.money||{}).saved || {};
    out.money.holdings = (d.money||{}).holdings || [];
    if(!out.fit.week || typeof out.fit.week[1] === "string" || typeof out.fit.week[1] === "undefined") {
      out.fit.week = base.fit.week;
    }
    delete out.fit.weekPlan;
    if(!out.fit.ex) out.fit.ex = {};
    out.exam.tasks = (d.exam||{}).tasks || {};
    out.exam.phases = (d.exam||{}).phases || base.exam.phases;
    out.exam.exams = (d.exam||{}).exams || base.exam.exams;
    out.exam.template = (d.exam||{}).template || base.exam.template;
    out.exam.notes = (d.exam||{}).notes || {};
    if(!d.photo && d.study){ out.photo.log = d.study.log||{}; out.photo.note = d.study.note||{}; }
    return out;
  }catch(e){ return defaults(); }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(D)); }

/* ==================================================================
   2. 工具
================================================================== */
const pad = n => String(n).padStart(2,"0");
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
const TODAY = ymd(new Date());
const NOW_MONTH = TODAY.slice(0,7);
const NOW_YEAR = TODAY.slice(0,4);
const DOW = new Date(TODAY+"T00:00:00").getDay();
function addDays(s,n){ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d); }
function weekStart(s){ const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); }
function monthShift(ym,n){ const d=new Date(ym+"-01T00:00:00"); d.setMonth(d.getMonth()+n); return d.toISOString().slice(0,7); }
function daysUntil(d){ return Math.round((new Date(d+"T00:00:00") - new Date(TODAY+"T00:00:00"))/86400000); }
function money(n){ return (Math.round((+n||0)*100)/100).toLocaleString("zh-CN",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function tagOf(name){ return (D.money.tags||[]).find(x=>x.name===name); }
function catColor(c){ const t=tagOf(c); return t? t.color : "#8d95a3"; }
function tagBucket(name){ const t=tagOf(name); return (t&&t.bucket)||"零花"; }
function fmtMMSS(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+pad(s%60); }

function donut(items, size=140, thickness=22){
  const total=items.reduce((s,i)=>s+i.value,0);
  if(!total) return '<div class="empty" style="width:140px">还没有记录</div>';
  const r=(size-thickness)/2, cx=size/2, cy=size/2;
  let a0=-Math.PI/2, out="";
  for(const it of items){
    const frac=it.value/total, a1=a0+frac*Math.PI*2;
    if(frac>=0.9999){
      out+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="${thickness}"/>`;
    }else{
      const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
      out+=`<path d="M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${r} ${r} 0 ${(a1-a0)>Math.PI?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}"
        fill="none" stroke="${it.color}" stroke-width="${thickness}"/>`;
    }
    a0=a1;
  }
  return `<svg viewBox="0 0 ${size} ${size}" class="donut">${out}</svg>`;
}
function weekGrid(isDone){
  const ws=weekStart(TODAY);
  return `<div class="day-grid">${[...Array(7)].map((_,i)=>{
    const d=addDays(ws,i), on=isDone(d);
    return `<div class="day-cell ${on?"done":""} ${d===TODAY?"today":""}">
      <b>${WEEK_S[new Date(d+"T00:00:00").getDay()]}</b>${on?"✓":"—"}</div>`;
  }).join("")}</div>`;
}

let tagManage=false;

function expensesIn(period){
  const ws=weekStart(TODAY);
  return D.money.expenses.filter(e=>{
    if(period==="today") return e.date===TODAY;
    if(period==="week")  return e.date>=ws && e.date<=addDays(ws,6);
    return e.date.slice(0,7)===NOW_MONTH;
  });
}
function planVals(){
  const p=D.money.plan, m=D.money;
  const savedThisMonth=(m.saved||{})[NOW_MONTH]||0;
  const savedThisYear=(p.savedBase||0)+Object.entries(m.saved||{})
    .filter(([k])=>k.startsWith(NOW_YEAR)).reduce((s,[,v])=>s+(+v||0),0);
  const monthly=Math.max(0, p.income - p.essential - p.pocket - p.buffer);
  const left=Math.max(0, p.yearGoal - savedThisYear);
  const months=monthly>0 ? Math.ceil(left/monthly) : 0;
  const spentBy=b=>expensesIn("month").filter(e=>tagBucket(e.cat)===b).reduce((s,e)=>s+e.amount,0);
  const holdings=m.holdings||[];
  const holdSum=holdings.reduce((s,h)=>s+(+h.amount||0),0);
  const holdAvg=holdSum? holdings.reduce((s,h)=>s+(+h.amount||0)*(+h.rate||0),0)/holdSum : 0;
  const dues=holdings.filter(h=>h.due).sort((a,b)=>a.due.localeCompare(b.due));
  return {p, savedThisMonth, savedThisYear, monthly, left, months,
          eta:monthShift(NOW_MONTH, months), spentBy, holdings, holdSum, holdAvg,
          nextDue:dues[0], pct: p.yearGoal? Math.min(100, savedThisYear/p.yearGoal*100):0};
}

      第三周开始看别人的作品，每天挑一张说出它为什么好看。<br>
      把想练的加进上面的清单，一天一项就够，30 分钟不要贪多。
    </div>
  </div>`;
}

function splitEx(line){
  const m=/^(.*?)\s*(\d+组.*|\d+\s*分钟.*)$/.exec(line);
  return m? {nm:m[1], st:m[2]} : {nm:line, st:""};
}
function fitStat(){
  const f=D.fit, p=f.profile;
  const bmr=10*p.weight+6.25*p.height-5*p.age+5;
  const tdee=bmr*p.activity;
  const lbm=p.weight*(1-p.bodyFat/100);
  const bmi=p.weight/Math.pow(p.height/100,2);
  const target=p.goal==="recomp"?0.90:(p.goal==="cut"?0.82:1.10);
  const intake=tdee*target;
  const protein=[Math.round(lbm*2.0), Math.round(lbm*2.4)];
  const fat=[Math.round(p.weight*0.8), Math.round(p.weight*1.0)];
  const carbs=Math.round((intake-protein[1]*4-fat[0]*9)/4);
  const bf18=lbm/(1-0.18);
  const day=f.week[DOW]||{name:"休息", ex:[]};
  const doneIdx=f.ex[TODAY]||[];
  const isRest=!day.ex.length;
  const allDone=!isRest && day.ex.every((_,i)=>doneIdx.includes(i));
  return {f,p,bmr,tdee,lbm,bmi,target,intake,protein,fat,carbs,bf18,day,doneIdx,isRest,
          allDone, dayDone: isRest? !!f.log[TODAY] : allDone};
}

    <button class="btn" id="fitToggle" style="width:100%;margin-top:12px">

  if(!e.tasks) e.tasks={};
  if(!e.tasks[TODAY]){
    e.tasks[TODAY]=(e.template||[]).map(t=>({id:uid(), text:t, done:false}));
    save();
  }
  return e.tasks[TODAY];
}

function examRecord(){
  const e=D.exam, t=e.tasks||{};
  let streak=0;
  for(let i=0;i<365;i++){
    const d=addDays(TODAY,-i), l=t[d]||[];
    const ok=l.length>0 && l.every(x=>x.done);
    if(ok) streak++; else if(i>0) break;
  }
  const totalDays=Object.keys(t).filter(k=>(t[k]||[]).some(x=>x.done)).length;
  const rows=[...Array(14)].map((_,i)=>addDays(TODAY,-i)).map(d=>{
    const l=t[d]||[], n=l.filter(x=>x.done).length;
    const full=l.length>0 && n===l.length;
    return `<li><span class="li-main"><span class="t">${d}${d===TODAY?"（今天）":""}</span></span>
      <span class="amount" style="color:${full?"var(--accent)":"var(--muted)"}">
        ${l.length? (full? "完成" : `${n}/${l.length}`) : "没学"}</span></li>`;
  }).join("");
  return `
  <div class="grid2">
    <div class="stat"><div class="lb">连续打卡</div><div class="val">${streak}<small>天</small></div>
      <div class="note">当天任务全部完成才算</div></div>
    <div class="stat"><div class="lb">累计学习</div><div class="val">${totalDays}<small>天</small></div>
      <div class="note">至少完成一项</div></div>
  </div>
  <div class="card">
    <h3>本周</h3>
    ${weekGrid(d=>{ const l=t[d]||[]; return l.length>0 && l.every(x=>x.done); })}
  </div>
  <div class="card">
    <h3>近 14 天</h3>
    <ul class="list">${rows}</ul>
  </div>
  <div class="card">
    <h3>今日笔记</h3>
    <textarea id="examNote" placeholder="今天错在哪、明天注意什么">${esc(e.notes[TODAY]||"")}</textarea>
  </div>`;
}

  money:{overview:moneyOverview, ledger:moneyLedger, invest:moneyInvest},
  work:{today:workToday, plan:workPlan, new:workNew},
  photo:{today:photoToday, log:photoLog, plan:photoPlan},
  fit:{today:fitToday, week:fitWeekPage, data:fitDataPage},

let MOD="exam";

function renderSubnav(){
  document.getElementById("subnav").innerHTML = SUBS[MOD]
    .map(([k,label])=>`<button data-sub="${k}" class="${SUB[MOD]===k?"on":""}">${label}</button>`).join("");
}
function renderPage(){
  const fn = PAGES[MOD] && PAGES[MOD][SUB[MOD]];
  document.getElementById("tab-"+MOD).innerHTML = fn
    ? fn()
    : '<div class="card"><div class="empty">这个页面没加载出来，刷新一下试试</div></div>';

function setMod(name){
  if(!MODS.includes(name)) name="exam";
  MOD=name;
  document.body.dataset.mod=name;
  document.getElementById("hTitle").textContent=TITLES[name];
  document.querySelectorAll("nav.tabbar button").forEach(x=>x.classList.toggle("on", x.dataset.tab===name));
  document.querySelectorAll(".tab").forEach(s=>s.classList.toggle("on", s.id==="tab-"+name));
  renderSubnav(); renderPage();
  history.replaceState(null,"","#"+name+"/"+SUB[name]);
  window.scrollTo(0,0);
}
function setSub(name){
  if(!SUBS[MOD].some(([k])=>k===name)) name=SUBS[MOD][0][0];
  SUB[MOD]=name;
  renderSubnav(); renderPage();
  history.replaceState(null,"","#"+MOD+"/"+name);
  window.scrollTo(0,0);
}

document.getElementById("tabbar").addEventListener("click", e=>{

document.body.addEventListener("click", e=>{
  const t=e.target;
  const period=t.closest("[data-period]");
  if(period){ D.money.period=period.dataset.period; save(); renderPage(); return; }

  if(t.id==="exAdd"){
    const amt=parseFloat(document.getElementById("exAmt").value);
    if(!(amt>0)) return alert("先填金额");
    const cat=D.money.currentTag || (D.money.tags[0]&&D.money.tags[0].name) || "其他";
    D.money.expenses.push({id:uid(), date:document.getElementById("exDate").value||TODAY,
      cat, note:document.getElementById("exNote").value.trim(), amount:amt});
    save(); paint();
    const again=document.getElementById("exAmt"); if(again) again.focus();
    return;
  }
  const chip=t.closest("[data-tag]");
  if(chip){
    const name=chip.dataset.tag;
    if(tagManage){
      if(confirm("删除标签「"+name+"」？已经记过的账不受影响。")){
        D.money.tags=D.money.tags.filter(x=>x.name!==name);
        if(D.money.currentTag===name) D.money.currentTag=(D.money.tags[0]||{}).name;
        save(); paint();
      }
    }else{ D.money.currentTag=name; save(); renderPage(); }
    return;
  }
  if(t.id==="tagAdd"){
    const v=(prompt("新标签名字，比如 房租、话费、宠物")||"").trim();
    if(!v) return;
    if(D.money.tags.some(x=>x.name===v)) return alert("这个标签已经有了");
    const used=new Set(D.money.tags.map(x=>x.color));
    const color=PALETTE.find(c=>!used.has(c)) || PALETTE[D.money.tags.length % PALETTE.length];
    const b=(prompt("归哪一类？填 必要 / 零花 / 专项","零花")||"零花").trim();
    D.money.tags.push({name:v, color, bucket:["必要","零花","专项"].includes(b)?b:"零花"});
    D.money.currentTag=v; save(); paint(); return;
  }
  if(t.id==="tagManage"){ tagManage=!tagManage; renderPage(); return; }
  const dh=t.closest("[data-del-hold]");
  if(dh){ if(confirm("删掉这条持仓记录？")){ D.money.holdings=D.money.holdings.filter(h=>h.id!==dh.dataset.delHold); save(); paint(); } return; }
  const dele=t.closest("[data-del-exp]");
  if(dele){ D.money.expenses=D.money.expenses.filter(x=>x.id!==dele.dataset.delExp); save(); paint(); return; }
  if(t.id==="svSave"){
    const v=parseFloat(document.getElementById("svAdd").value);
    if(!(v>=0)) return alert("填一个金额");
    D.money.saved[NOW_MONTH]=v; save(); paint(); return;
  }
  if(t.id==="hdAdd"){
    const name=document.getElementById("hdName").value.trim();
    const amt=parseFloat(document.getElementById("hdAmt").value);
    if(!name || !(amt>0)) return alert("产品名和金额都要填");
    D.money.holdings.push({id:uid(), name, amount:amt,
      rate:parseFloat(document.getElementById("hdRate").value)||0,
      due:document.getElementById("hdDue").value||""});
    save(); paint(); return;
  }
  if(t.dataset.quickdate){
    const el=document.getElementById("wkDate");
    if(el) el.value=addDays(TODAY, +t.dataset.quickdate);
    return;
  }
  if(t.id==="wkAdd"){
    const v=document.getElementById("wkText").value.trim(); if(!v) return;
    D.work.tasks.push({id:uid(), date:document.getElementById("wkDate").value||TODAY, text:v, done:false});
    save(); setSub("today"); paint(); return;
  }
  const tw=t.closest("[data-toggle-work]");
  if(tw){ const x=D.work.tasks.find(a=>a.id===tw.dataset.toggleWork); if(x){ x.done=!x.done; save(); paint(); } return; }
  const dw=t.closest("[data-del-work]");
  if(dw){ D.work.tasks=D.work.tasks.filter(a=>a.id!==dw.dataset.delWork); save(); paint(); return; }
  const tp=t.closest("[data-toggle-plan]");
  if(tp){
    const id=tp.dataset.togglePlan, cur=D.photo.log[TODAY]||[];
    D.photo.log[TODAY]= cur.includes(id)? cur.filter(x=>x!==id) : [...cur,id];
    save(); paint(); return;
  }
  const dp=t.closest("[data-del-plan]");
  if(dp){ D.photo.plan=D.photo.plan.filter(p=>p.id!==dp.dataset.delPlan); save(); paint(); return; }
  if(t.id==="stAdd"){
    const v=document.getElementById("stText").value.trim(); if(!v) return;
    D.photo.plan.push({id:uid(), text:v}); save(); paint(); return;
  }
  if(t.id==="tmBtn"){ timerToggle(); return; }
  if(t.id==="tmReset"){ if(TIMER.id) clearInterval(TIMER.id); TIMER.running=false; TIMER.id=null; TIMER.left=0; paint(); return; }
  const te=t.closest("[data-toggle-ex]");
  if(te){
    const i=+te.dataset.toggleEx, cur=D.fit.ex[TODAY]||[];
    D.fit.ex[TODAY]= cur.includes(i)? cur.filter(x=>x!==i) : [...cur,i].sort((a,b)=>a-b);
    save(); paint(); return;
  }
  if(t.dataset.exadd!==undefined && t.dataset.exadd!==""){
    const d=t.dataset.exadd;
    D.fit.week[d].ex = D.fit.week[d].ex || [];
    D.fit.week[d].ex.push("新动作 3组×10次");
    save(); renderPage(); return;
  }
  if(t.dataset.exdel){ const [d,i]=t.dataset.exdel.split("-"); D.fit.week[d].ex.splice(+i,1); save(); renderPage(); return; }
  if(t.id==="fitToggle"){
    const day=D.fit.week[DOW]||{ex:[]};
    if(!day.ex.length){ D.fit.log[TODAY]=!D.fit.log[TODAY]; }
    else{
      const cur=D.fit.ex[TODAY]||[];
      D.fit.ex[TODAY]= day.ex.every((_,i)=>cur.includes(i)) ? [] : day.ex.map((_,i)=>i);
    }
    save(); paint(); return;
  }

  const tex=t.closest("[data-toggle-exam]");
  if(tex){
    const it=(D.exam.tasks[TODAY]||[]).find(x=>x.id===tex.dataset.toggleExam);
    if(it){ it.done=!it.done; save(); paint(); }
    return;
  }
  const dex=t.closest("[data-del-exam]");
  if(dex){
    D.exam.tasks[TODAY]=(D.exam.tasks[TODAY]||[]).filter(x=>x.id!==dex.dataset.delExam);
    save(); paint(); return;
  }
  if(t.id==="examAddBtn"){
    const v=document.getElementById("examAdd").value.trim(); if(!v) return;
    D.exam.tasks[TODAY].push({id:uid(), text:v, done:false});
    save(); paint(); return;
  }
  if(t.id==="tplAddBtn"){
    const v=document.getElementById("tplAdd").value.trim(); if(!v) return;
    D.exam.template.push(v); save(); renderPage(); return;
  }
  const dt=t.closest("[data-del-tpl]");
  if(dt){ D.exam.template.splice(+dt.dataset.delTpl,1); save(); renderPage(); return; }
});

document.body.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.acct){ D.money.accounts[t.dataset.acct]=parseFloat(t.value)||0; save(); paint(); return; }
  if(t.dataset.plan){ D.money.plan[t.dataset.plan]=parseFloat(t.value)||0; save(); paint(); return; }
  if(t.hasAttribute("data-budget")){ D.money.dailyBudget=parseFloat(t.value)||0; save(); paint(); return; }
  if(t.id==="phTime"){ D.photo.time=t.value; save(); return; }
  if(t.id==="phMin"){ D.photo.minutes=Math.max(1,parseFloat(t.value)||30); TIMER.left=0; save(); paint(); return; }
  if(t.dataset.daytitle!==undefined && t.dataset.daytitle!==""){ D.fit.week[t.dataset.daytitle].name=t.value; save(); return; }
  if(t.dataset.ex){ const [d,i]=t.dataset.ex.split("-"); D.fit.week[d].ex[+i]=t.value; save(); return; }
  if(t.dataset.fit){ D.fit.profile[t.dataset.fit]= t.dataset.fit==="goal"? t.value : (parseFloat(t.value)||0); save(); paint(); return; }
  if(t.dataset.phaseName){ const p=D.exam.phases.find(x=>x.id===t.dataset.phaseName); if(p) p.name=t.value; save(); return; }
  if(t.dataset.phaseFrom){ const p=D.exam.phases.find(x=>x.id===t.dataset.phaseFrom); if(p) p.from=t.value; save(); return; }
  if(t.dataset.phaseTo){ const p=D.exam.phases.find(x=>x.id===t.dataset.phaseTo); if(p) p.to=t.value; save(); return; }
  if(t.dataset.phaseGoal){ const p=D.exam.phases.find(x=>x.id===t.dataset.phaseGoal); if(p) p.goal=t.value; save(); return; }
  if(t.dataset.examName){ const x=D.exam.exams.find(a=>a.id===t.dataset.examName); if(x) x.name=t.value; save(); paint(); return; }
  if(t.dataset.examDate){ const x=D.exam.exams.find(a=>a.id===t.dataset.examDate); if(x) x.date=t.value; save(); paint(); return; }
});
document.body.addEventListener("input", e=>{
  if(e.target.id==="stNote"){ D.photo.note[TODAY]=e.target.value; save(); }
  if(e.target.id==="examNote"){ D.exam.notes[TODAY]=e.target.value; save(); }
});

/* 计时器 */
function timerDone(){
  D.photo.log[TODAY]=D.photo.plan.map(p=>p.id);
  save(); paint();
  alert((D.photo.minutes||30)+" 分钟到了，今天的摄影学习自动打卡完成。");
}
function timerToggle(){
  if(TIMER.running){
    clearInterval(TIMER.id); TIMER.running=false; TIMER.id=null; paint(); return;
  }
  if(TIMER.left<=0) TIMER.left=(D.photo.minutes||30)*60;
  TIMER.running=true;
  TIMER.id=setInterval(()=>{
    TIMER.left--;
    const el=document.getElementById("tmDisplay");
    if(el) el.textContent=fmtMMSS(TIMER.left);
    if(TIMER.left<=0){ clearInterval(TIMER.id); TIMER.running=false; TIMER.id=null; timerDone(); }
  },1000);
  paint();
}

  r.readAsText(f);
};
